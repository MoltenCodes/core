name: apiKit mirror heads

# Watches the community mirror the apiKit metadata is generated from. Once a
# day it asks, for every flavour, which build the mirror's branches carry
# (`python3 -m tooling.api.heads`, which reads the branch heads the way
# `python3 -m tooling.api.fetch --heads --flavour <id>` prints them) and holds
# the answer against packages/apiKit/metadata/<id>/provenance.json.
#
# While any flavour is behind, exactly one issue titled ISSUE_TITLE is open:
# created on the first run that finds a newer build, its body rewritten only
# when the report changes, closed by the first run that finds every flavour
# current again. The update itself is the pipeline in docs/TOOLING.md ("API
# metadata tooling"), run by a maintainer; nothing here fetches tables or
# commits.

on:
  schedule:
    # Daily, at an off-peak minute.
    - cron: "41 5 * * *"
  workflow_dispatch:

# Nothing by default; the job asks for what it uses.
permissions: {}

concurrency:
  # Never two runs at once: both could see no issue and open one each.
  group: api-heads
  cancel-in-progress: false

env:
  ISSUE_TITLE: "apiKit: the mirror carries a newer client build"
  ISSUE_LABEL: "kit: apiKit"

jobs:
  heads:
    name: Compare mirror heads with the committed metadata
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # Opening, editing and closing the one tracking issue.
      issues: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      # The job token only raises the GitHub API rate limit for the mirror's
      # public commit lookups (tooling/api/fetch.py reads GITHUB_TOKEN).
      - name: Compare every flavour
        id: heads
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 -m tooling.api.heads \
            --markdown "${RUNNER_TEMP}/api-heads.md" \
            --github-output "${GITHUB_OUTPUT}"

      - name: Open, update or close the tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          NEWER: ${{ steps.heads.outputs.newer }}
          REPORT: ${{ runner.temp }}/api-heads.md
        run: |
          set -euo pipefail
          number="$(gh issue list --repo "${GITHUB_REPOSITORY}" --state open \
            --label "${ISSUE_LABEL}" --limit 200 --json number,title \
            --jq "map(select(.title == env.ISSUE_TITLE)) | .[0].number // empty")"

          if [[ "${NEWER}" == "true" ]]; then
            if [[ -z "${number}" ]]; then
              gh issue create --repo "${GITHUB_REPOSITORY}" --title "${ISSUE_TITLE}" \
                --label "${ISSUE_LABEL}" --body-file "${REPORT}"
            elif [[ "$(gh issue view "${number}" --repo "${GITHUB_REPOSITORY}" --json body --jq .body)" \
                    != "$(cat "${REPORT}")" ]]; then
              gh issue edit "${number}" --repo "${GITHUB_REPOSITORY}" --body-file "${REPORT}"
            else
              echo "Issue #${number} already describes these builds."
            fi
          elif [[ -n "${number}" ]]; then
            gh issue close "${number}" --repo "${GITHUB_REPOSITORY}" \
              --comment "Every flavour's committed metadata now matches the newest build on the mirror."
          else
            echo "Every flavour is current."
          fi

          if [[ -f "${REPORT}" ]]; then
            cat "${REPORT}" >> "${GITHUB_STEP_SUMMARY}"
          fi
