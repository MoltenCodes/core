name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The prebuilt Selene the lint job installs instead of building from source.
  # "light" is the build without the Roblox standard library, which is what
  # `cargo install selene --no-default-features` used to produce here.
  SELENE_VERSION: "0.31.0"
  SELENE_SHA256: "0580eed94b56e8b4bad3b1d6f5a4f9e1a9f5d88ae5bc511290c3cd33cc5e0360"

  # The lua-language-server release the type-check job runs.
  LUALS_VERSION: "3.19.0"
  LUALS_SHA256: "624ae8dd3bfbd5c2ee3ccf2f3547d33aeefa209971cce8c11d48f69fc1ec065a"

jobs:
  test:
    name: Lua 5.1 tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # Every action below is pinned to a commit SHA. A tag such as `v7` is a
      # moving reference the upstream owner can repoint at any time, including
      # at code this repository has never reviewed; a SHA cannot move. The
      # trailing comment records which release the SHA was taken from, because
      # a bare SHA says nothing about how far behind the pin has fallen.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Set up Lua
        uses: leafo/gh-actions-lua@6919171ccf181b826f44b9bca76307b577217377 # v13.0.0
        with:
          luaVersion: "5.1.5"

      - name: Set up LuaRocks
        uses: leafo/gh-actions-luarocks@35d062def313a7699a0d513e996bcf4352f05389 # v6.1.0
        with:
          luaRocksVersion: "3.13.0"

      - name: Install Busted
        run: luarocks install busted 2.3.0-1

      # This runs every package suite and the example addon's specs, which is
      # the same command and the same targets a developer runs locally.
      - name: Run package and example tests
        run: python3 -m tooling.test.run

  types:
    name: lua-language-server
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install lua-language-server
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            --output lua-language-server.tar.gz \
            "https://github.com/LuaLS/lua-language-server/releases/download/${LUALS_VERSION}/lua-language-server-${LUALS_VERSION}-linux-x64.tar.gz"
          echo "${LUALS_SHA256}  lua-language-server.tar.gz" | sha256sum --check --strict -
          mkdir -p "${RUNNER_TEMP}/luals"
          tar -xzf lua-language-server.tar.gz -C "${RUNNER_TEMP}/luals"
          echo "${RUNNER_TEMP}/luals/bin" >> "${GITHUB_PATH}"

      # Each package source directory carries its own `.luarc.json`, because
      # `--check` treats the directory it is given as the workspace root and
      # ignores parent configuration. Checking every directory is therefore the
      # only way to prove each package type-checks on its own.
      - name: Type-check every source directory
        run: |
          set -euo pipefail
          status=0
          for directory in packages/*/src examples; do
            echo "==> ${directory}"
            lua-language-server --check "${directory}" --checklevel=Warning || status=1
          done
          exit "${status}"

  format:
    name: StyLua
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # No token is passed. The action only needs one to raise GitHub's
      # anonymous API rate limit while resolving the release to download, and a
      # third-party action that is handed `GITHUB_TOKEN` can use it for anything
      # the job's permissions allow.
      - name: Check formatting
        uses: JohnnyMorganz/stylua-action@76fd70c03e6340ceaf673366712db9b20560b402 # v5.0.0
        with:
          version: "2.5.2"
          args: --check .

  lint:
    name: Selene
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      # The published binary replaces `cargo install selene`, which rebuilt the
      # whole dependency tree from source on every run for a tool whose output
      # never depends on how it was compiled. The checksum is what makes the
      # download as trustworthy as the build was: an unexpected artifact fails
      # the job instead of linting the repository.
      - name: Install Selene
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --output selene.zip \
            "https://github.com/Kampfkarren/selene/releases/download/${SELENE_VERSION}/selene-light-${SELENE_VERSION}-linux.zip"
          echo "${SELENE_SHA256}  selene.zip" | sha256sum --check --strict -
          mkdir -p "${RUNNER_TEMP}/selene"
          unzip -o -q selene.zip -d "${RUNNER_TEMP}/selene"
          chmod +x "${RUNNER_TEMP}/selene/selene"
          echo "${RUNNER_TEMP}/selene" >> "${GITHUB_PATH}"

      # Runtime Lua under `selene.toml` and test Lua under `selene-tests.toml`,
      # which adds the Busted standard library.
      - name: Lint runtime and test Lua
        run: python3 -m tooling.lint

  repository:
    name: Repository validation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        # The floor is what `requires-python` in `pyproject.toml` declares, so
        # the documented minimum is exercised rather than merely asserted. The
        # second row is the release developers actually run.
        python-version: ["3.10", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Validate repository
        run: python3 -m tooling.validation.validate_repository

      - name: Run tooling unit tests
        run: python3 -m unittest discover -s tooling/tests -p "test_*.py"

      - name: Compile Python tooling
        run: python3 -m compileall -q tooling
