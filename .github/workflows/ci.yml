name: CI

# Every gate a change must pass, and one summary job, `ci`, that needs all of
# them. Branch protection requires `ci` alone, so adding or renaming a gate
# never means editing the protection rule.
#
# There is deliberately no `paths` or `paths-ignore` filter. Every file in the
# repository is judged by at least one gate (Lua by the tests and linters,
# Markdown by the spell check and link validation, workflows by actionlint,
# everything by the secret scan), and a workflow skipped by a path filter
# leaves a required check waiting forever instead of passing.
#
# Keeping the pins current: Dependabot (.github/dependabot.yml) proposes new
# SHAs for every `uses:` line below, weekly, and rewrites the trailing version
# comment with them. The binaries downloaded by version and SHA-256 in `env`
# are not tracked by Dependabot; they are bumped by hand, both values together.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Nothing by default; each job asks for exactly what it uses.
permissions: {}

concurrency:
  # A newer push to the same branch or pull request supersedes the running one.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The prebuilt Selene the lint job installs instead of building from source.
  # "light" is the build without the Roblox standard library, which is what
  # `cargo install selene --no-default-features` used to produce here.
  SELENE_VERSION: "0.31.0"
  SELENE_SHA256: "0580eed94b56e8b4bad3b1d6f5a4f9e1a9f5d88ae5bc511290c3cd33cc5e0360"

  # The StyLua release the format job runs, from its release page's
  # `stylua-linux-x86_64.zip`; a binary rather than stylua-action, which needs
  # the job token to list releases.
  STYLUA_VERSION: "2.5.2"
  STYLUA_SHA256: "bcb0d855e91f102f28a370e850f8566b3b44b79e6274d806ea5246837c0fd5ab"

  # The lua-language-server release the type-check job runs.
  LUALS_VERSION: "3.19.0"
  LUALS_SHA256: "624ae8dd3bfbd5c2ee3ccf2f3547d33aeefa209971cce8c11d48f69fc1ec065a"

  # The workflow linter the `workflows` job runs, from its release page's
  # `actionlint_<version>_checksums.txt`.
  ACTIONLINT_VERSION: "1.7.12"
  ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"

  # The secret scanner the `secrets` job runs, from its release page's
  # `gitleaks_<version>_checksums.txt`. The binary is used rather than
  # gitleaks-action because that action needs a licence key for repositories
  # owned by an organisation, and this one is.
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"

jobs:
  test:
    name: Lua 5.1 tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        # Every job that runs repository tooling runs it on both supported
        # Pythons: the floor `requires-python` in `pyproject.toml` declares, and
        # the release developers actually use. The test runner is Python, so the
        # floor has to orchestrate Busted as well as the newer interpreter does.
        python-version: ["3.10", "3.13"]

    steps:
      # Every action below is pinned to a commit SHA. A tag such as `v7` is a
      # moving reference the upstream owner can repoint at any time, including
      # at code this repository has never reviewed; a SHA cannot move. The
      # trailing comment records which release the SHA was taken from, because
      # a bare SHA says nothing about how far behind the pin has fallen.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up Lua
        uses: leafo/gh-actions-lua@6919171ccf181b826f44b9bca76307b577217377 # v13.0.0
        with:
          luaVersion: "5.1.5"

      - name: Set up LuaRocks
        uses: leafo/gh-actions-luarocks@35d062def313a7699a0d513e996bcf4352f05389 # v6.1.0
        with:
          luaRocksVersion: "3.13.0"

      - name: Install Busted
        run: luarocks install busted 2.3.0-1

      # This runs every package suite and the example addon's specs, which is
      # the same command and the same targets a developer runs locally.
      - name: Run package and example tests
        run: python3 -m tooling.test.run

  types:
    name: lua-language-server
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install lua-language-server
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            --output lua-language-server.tar.gz \
            "https://github.com/LuaLS/lua-language-server/releases/download/${LUALS_VERSION}/lua-language-server-${LUALS_VERSION}-linux-x64.tar.gz"
          echo "${LUALS_SHA256}  lua-language-server.tar.gz" | sha256sum --check --strict -
          mkdir -p "${RUNNER_TEMP}/luals"
          tar -xzf lua-language-server.tar.gz -C "${RUNNER_TEMP}/luals"
          echo "${RUNNER_TEMP}/luals/bin" >> "${GITHUB_PATH}"

      # Each package source directory carries its own `.luarc.json`, because
      # `--check` treats the directory it is given as the workspace root and
      # ignores parent configuration. Checking every directory is therefore the
      # only way to prove each package type-checks on its own.
      - name: Type-check every source directory
        run: |
          set -euo pipefail
          status=0
          for directory in packages/*/src examples; do
            echo "==> ${directory}"
            lua-language-server --check "${directory}" --checklevel=Warning || status=1
          done
          exit "${status}"

  format:
    name: StyLua
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install StyLua
        run: |
          curl --fail --silent --show-error --location --output stylua.zip \
            "https://github.com/JohnnyMorganz/StyLua/releases/download/v${STYLUA_VERSION}/stylua-linux-x86_64.zip"
          echo "${STYLUA_SHA256}  stylua.zip" | sha256sum --check --strict -
          mkdir -p "${RUNNER_TEMP}/stylua"
          unzip -o -q stylua.zip -d "${RUNNER_TEMP}/stylua"
          chmod +x "${RUNNER_TEMP}/stylua/stylua"
          echo "${RUNNER_TEMP}/stylua" >> "${GITHUB_PATH}"

      - name: Check formatting
        run: stylua --check .

  lint:
    name: Selene
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        # The linter is Python too: it discovers the Lua to lint and invokes
        # Selene, so it runs on the floor and on the current release like the
        # rest of the tooling.
        python-version: ["3.10", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      # The published binary replaces `cargo install selene`, which rebuilt the
      # whole dependency tree from source on every run for a tool whose output
      # never depends on how it was compiled. The checksum is what makes the
      # download as trustworthy as the build was: an unexpected artifact fails
      # the job instead of linting the repository.
      - name: Install Selene
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --output selene.zip \
            "https://github.com/Kampfkarren/selene/releases/download/${SELENE_VERSION}/selene-light-${SELENE_VERSION}-linux.zip"
          echo "${SELENE_SHA256}  selene.zip" | sha256sum --check --strict -
          mkdir -p "${RUNNER_TEMP}/selene"
          unzip -o -q selene.zip -d "${RUNNER_TEMP}/selene"
          chmod +x "${RUNNER_TEMP}/selene/selene"
          echo "${RUNNER_TEMP}/selene" >> "${GITHUB_PATH}"

      # Runtime Lua under `selene.toml` and test Lua under `selene-tests.toml`,
      # which adds the Busted standard library.
      - name: Lint runtime and test Lua
        run: python3 -m tooling.lint

  package:
    name: Release bundle
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        # Both supported Pythons, like every other job that runs repository
        # tooling: a release must be buildable from the declared floor.
        python-version: ["3.10", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      # Building against the real tree is the only way to prove the repository
      # can still be released: the builder fails closed on package metadata no
      # other job exercises, and `--verify` reads the `CHECKSUMS.txt` it just
      # wrote back to prove it describes the bundle beside it exactly -- nothing
      # recorded that is missing, nothing shipped that is unrecorded.
      - name: Build every package into a bundle
        run: python3 -m tooling.package.build --all --out "${RUNNER_TEMP}/bundle" --verify

      # `--verify` proves the file is correct; `sha256sum --check` proves it is
      # also usable, because a downloader verifies the artifact with that tool
      # and not with this repository's tooling. `--strict` fails on a line the
      # tool cannot parse instead of quietly skipping it.
      - name: Verify the checksums the way a downloader would
        working-directory: ${{ runner.temp }}/bundle
        run: sha256sum --check --strict CHECKSUMS.txt

  spell:
    name: Spell check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        # The runner is Python like the rest of the tooling, so it runs on the
        # floor and on the current release; cspell itself is Node.
        python-version: ["3.10", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      # The pinned cspell release (`CSPELL_VERSION` in tooling/spell.py) needs
      # Node 22.18 or newer. The runner image's own Node is whatever the image
      # ships that week, so the version is set here instead of assumed.
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      # `--require` turns "Node is missing" into a failure. Locally the same
      # command skips with a note so a contributor without Node is not blocked;
      # here the gate must never be skipped silently.
      - name: Spell-check the documentation
        run: python3 -m tooling.spell --require

      # The unit suite in the repository job stays offline; these tests run the
      # real, pinned cspell against a misspelled fixture and a project word.
      - name: Run the spell-check integration tests
        env:
          MOLTENCODES_SPELL_INTEGRATION: "1"
        run: python3 -m unittest tooling.tests.test_spell

  repository:
    name: Repository validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        # The floor is what `requires-python` in `pyproject.toml` declares, so
        # the documented minimum is exercised rather than merely asserted. The
        # second row is the release developers actually run.
        python-version: ["3.10", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Validate repository
        run: python3 -m tooling.validation.validate_repository

      # The apiKit runtime files, types, reference and search index are
      # generated from the committed metadata; a metadata change committed
      # without regenerating them would ship bindings that disagree with it.
      - name: Check generated apiKit outputs are current
        run: python3 -m tooling.api.generate --all --check

      - name: Run tooling unit tests
        run: python3 -m unittest discover -s tooling/tests -p "test_*.py"

      - name: Compile Python tooling
        run: python3 -m compileall -q tooling

  commits:
    name: Commit subjects
    # Only a pull request has a range of new commits and a title to judge.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        # Repository tooling runs on the floor and the current release.
        python-version: ["3.10", "3.13"]

    steps:
      # Full history, so both ends of the pull request's range are present.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      # The title is checked too, because a squash merge makes it the commit
      # subject. Both values travel through the environment, never through
      # the script text, so a crafted title cannot become shell.
      - name: Check every commit subject and the title
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: python3 -m tooling.ci.check_commits "${BASE_SHA}..${HEAD_SHA}" --subject "${PR_TITLE}"

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      # Full history: a secret removed by a later commit is still published.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --output gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check --strict -
          mkdir -p "${RUNNER_TEMP}/gitleaks"
          tar -xzf gitleaks.tar.gz -C "${RUNNER_TEMP}/gitleaks" gitleaks
          echo "${RUNNER_TEMP}/gitleaks" >> "${GITHUB_PATH}"

      # `--redact` keeps a found secret out of the public job log.
      - name: Scan the whole history
        run: gitleaks git --redact --no-banner --verbose .

  workflows:
    name: actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # actionlint also runs shellcheck over every `run:` block; the runner
      # image ships shellcheck, so the script checks are part of this gate.
      - name: Install actionlint
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --output actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  actionlint.tar.gz" | sha256sum --check --strict -
          mkdir -p "${RUNNER_TEMP}/actionlint"
          tar -xzf actionlint.tar.gz -C "${RUNNER_TEMP}/actionlint" actionlint
          echo "${RUNNER_TEMP}/actionlint" >> "${GITHUB_PATH}"

      - name: Lint every workflow
        run: actionlint -color

  # The one check branch protection requires. It runs even when a gate failed
  # or was cancelled (`always()`), so it reports that failure instead of being
  # skipped, which branch protection would count as passing. `commits` is
  # skipped on pushes by design; a skip is therefore accepted, a failure or a
  # cancellation is not.
  ci:
    name: ci
    if: always()
    needs: [test, types, format, lint, package, spell, repository, commits, secrets, workflows]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}

    steps:
      - name: Require every gate
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
          FAILED: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: |
          echo "Gate results: ${RESULTS}"
          if [[ "${FAILED}" == "true" ]]; then
            echo "::error::At least one gate failed or was cancelled."
            exit 1
          fi
