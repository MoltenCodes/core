name: Release

# Builds, checks and (when allowed) publishes a release.
#
# Two kinds of tag start it (docs/RELEASES.md, "Tags"):
#   - a bundle tag `v<major>.<minor>.<patch>` releases every release package as
#     the addon "MoltenCodes";
#   - a package tag `<packageId>-v<major>.<minor>.<patch>` releases one Kit and
#     the packages it requires as the addon "MoltenCodes-<Facade>".
# The `resolve` job checks the tag and tells every later job which kind it is.
# A hand-started run may name a tag to rehearse; without one it builds the
# bundle without a tag check.
#
# Nothing here pushes, tags, or publishes a GitHub release: the GitHub release
# is always created as a DRAFT, only when the run's ref is the released tag
# (pushed, or a hand-started run from that tag), and a maintainer publishes it
# by hand. See docs/RELEASES.md for the whole procedure.
#
# Upload to the addon sites is a dry run (`-d`) unless every one of these holds
# (tooling.release.publish_mode decides):
#   - the run was not started by hand with `dry_run` left on;
#   - the repository variables CURSEFORGE_PROJECT_ID, WAGO_ID and WOWI_ID are set;
#   - the tag is a bundle tag: a package tag never uploads in this version.
# The secrets CF_API_KEY, WAGO_API_TOKEN and WOWI_API_TOKEN are read only by the
# packager step, and only matter once the dry run is off.

on:
  push:
    tags: ["v*.*.*", "*-v*.*.*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and package, but upload nothing to the addon sites."
        type: boolean
        default: true
      tag:
        description: "Rehearse this tag (v0.1.0 or timerKit-v0.6.0) on the chosen branch. Empty: build every release package without a tag check."
        type: string
        default: ""

# Nothing by default; each job asks for exactly what it uses. Only `publish`
# writes, and only to draft the GitHub release.
permissions: {}

concurrency:
  # Never cancel a release half-way; queue a second run for the same ref
  # instead. This is the one workflow that does not cancel a superseded run,
  # because a cancelled release can leave a draft half-uploaded.
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # Kept in step with ci.yml, which is where these pins are reviewed. Every
  # `uses:` below is pinned to a commit SHA with its release in a trailing
  # comment, like ci.yml; Dependabot proposes updates to both.
  SELENE_VERSION: "0.31.0"
  SELENE_SHA256: "0580eed94b56e8b4bad3b1d6f5a4f9e1a9f5d88ae5bc511290c3cd33cc5e0360"
  STYLUA_VERSION: "2.5.2"
  STYLUA_SHA256: "bcb0d855e91f102f28a370e850f8566b3b44b79e6274d806ea5246837c0fd5ab"
  LUALS_VERSION: "3.19.0"
  LUALS_SHA256: "624ae8dd3bfbd5c2ee3ccf2f3547d33aeefa209971cce8c11d48f69fc1ec065a"

jobs:
  # First, because it is the cheapest check and the one a tag most often fails:
  # the tag's section in docs/RELEASES.md must match the manifests. Its outputs
  # decide what every later job builds and packages.
  resolve:
    name: Resolve the tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read

    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      kind: ${{ steps.tag.outputs.kind }}
      package: ${{ steps.tag.outputs.package }}
      version: ${{ steps.tag.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      # The `tag` input of a hand-started run wins over the ref it was started
      # from. check_tag rejects anything that is not one of the two tag forms,
      # so its outputs are safe to hand to later shell steps.
      - name: Check the tag against docs/RELEASES.md
        id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
          PUSHED_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          set -euo pipefail
          tag="${INPUT_TAG:-${PUSHED_TAG}}"
          if [[ -z "${tag}" ]]; then
            echo "No tag: building every release package without a tag check."
            {
              echo "tag="
              echo "kind=bundle"
              echo "package="
              echo "version="
            } >> "${GITHUB_OUTPUT}"
          else
            python3 -m tooling.release.check_tag "${tag}" --github-output "${GITHUB_OUTPUT}"
          fi

  verify:
    name: Verify the tagged tree
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    strategy:
      fail-fast: true
      matrix:
        # The same two Pythons every CI job that runs repository tooling uses.
        python-version: ["3.10", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Validate repository
        run: python3 -m tooling.validation.validate_repository

      - name: Run tooling unit tests
        run: python3 -m unittest discover -s tooling/tests -p "test_*.py"

      - name: Set up Lua
        uses: leafo/gh-actions-lua@6919171ccf181b826f44b9bca76307b577217377 # v13.0.0
        with:
          luaVersion: "5.1.5"

      - name: Set up LuaRocks
        uses: leafo/gh-actions-luarocks@35d062def313a7699a0d513e996bcf4352f05389 # v6.1.0
        with:
          luaRocksVersion: "3.13.0"

      - name: Install Busted
        run: luarocks install busted 2.3.0-1

      - name: Run package and example tests
        run: python3 -m tooling.test.run

      - name: Install Selene
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --output selene.zip \
            "https://github.com/Kampfkarren/selene/releases/download/${SELENE_VERSION}/selene-light-${SELENE_VERSION}-linux.zip"
          echo "${SELENE_SHA256}  selene.zip" | sha256sum --check --strict -
          mkdir -p "${RUNNER_TEMP}/selene"
          unzip -o -q selene.zip -d "${RUNNER_TEMP}/selene"
          chmod +x "${RUNNER_TEMP}/selene/selene"
          echo "${RUNNER_TEMP}/selene" >> "${GITHUB_PATH}"

      - name: Lint runtime and test Lua
        run: python3 -m tooling.lint

      - name: Install StyLua
        run: |
          curl --fail --silent --show-error --location --output stylua.zip \
            "https://github.com/JohnnyMorganz/StyLua/releases/download/v${STYLUA_VERSION}/stylua-linux-x86_64.zip"
          echo "${STYLUA_SHA256}  stylua.zip" | sha256sum --check --strict -
          mkdir -p "${RUNNER_TEMP}/stylua"
          unzip -o -q stylua.zip -d "${RUNNER_TEMP}/stylua"
          chmod +x "${RUNNER_TEMP}/stylua/stylua"
          echo "${RUNNER_TEMP}/stylua" >> "${GITHUB_PATH}"

      - name: Check formatting
        run: stylua --check .

      - name: Install lua-language-server
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            --output lua-language-server.tar.gz \
            "https://github.com/LuaLS/lua-language-server/releases/download/${LUALS_VERSION}/lua-language-server-${LUALS_VERSION}-linux-x64.tar.gz"
          echo "${LUALS_SHA256}  lua-language-server.tar.gz" | sha256sum --check --strict -
          mkdir -p "${RUNNER_TEMP}/luals"
          tar -xzf lua-language-server.tar.gz -C "${RUNNER_TEMP}/luals"
          echo "${RUNNER_TEMP}/luals/bin" >> "${GITHUB_PATH}"

      - name: Type-check every source directory
        run: |
          set -euo pipefail
          status=0
          for directory in packages/*/src examples; do
            echo "==> ${directory}"
            lua-language-server --check "${directory}" --checklevel=Warning || status=1
          done
          exit "${status}"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Spell-check the documentation
        run: python3 -m tooling.spell --require

  build:
    name: Build the bundles
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    env:
      KIND: ${{ needs.resolve.outputs.kind }}
      PACKAGE_ID: ${{ needs.resolve.outputs.package }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      # Bundle release: the whole framework, as one bundle that installs as the
      # addon "MoltenCodes", with its checksums and its .toc verified by the
      # builder and the checksums again by the tool a downloader uses.
      - name: Build the framework bundle
        if: env.KIND == 'bundle'
        run: |
          set -euo pipefail
          python3 -m tooling.package.build --all --out dist/framework --zip --verify
          (cd dist/framework && sha256sum --check --strict CHECKSUMS.txt)

      # Kits are independently publishable, so a bundle release also carries a
      # bundle per Kit (with its dependency closure). The list comes from the
      # manifests through tooling and leaves out development packages, which
      # are tested but never bundled.
      - name: Build one bundle per package
        if: env.KIND == 'bundle'
        run: |
          set -euo pipefail
          package_ids="$(python3 -m tooling.package.list --release)"
          for package_id in ${package_ids}; do
            python3 -m tooling.package.build --package "${package_id}" \
              --out "dist/packages/${package_id}" --zip --verify
            (cd "dist/packages/${package_id}" && sha256sum --check --strict CHECKSUMS.txt)
          done

      # Package release: that Kit and the packages it requires, as the addon
      # "MoltenCodes-<Facade>".
      - name: Build the package bundle
        if: env.KIND == 'package'
        run: |
          set -euo pipefail
          python3 -m tooling.package.build --package "${PACKAGE_ID}" \
            --out "dist/release/${PACKAGE_ID}" --zip --verify
          (cd "dist/release/${PACKAGE_ID}" && sha256sum --check --strict CHECKSUMS.txt)

      - name: Upload the framework bundle
        if: env.KIND == 'bundle'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: framework-bundle
          path: dist/framework
          if-no-files-found: error

      - name: Upload the per-package bundles
        if: env.KIND == 'bundle'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package-bundles
          path: dist/packages
          if-no-files-found: error

      - name: Upload the package bundle
        if: env.KIND == 'package'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package-release
          path: dist/release
          if-no-files-found: error

  publish:
    name: Package, upload and draft the release
    needs: [resolve, verify, build]
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      TAG: ${{ needs.resolve.outputs.tag }}
      KIND: ${{ needs.resolve.outputs.kind }}
      PACKAGE_ID: ${{ needs.resolve.outputs.package }}

    permissions:
      # Only to create or update the DRAFT GitHub release below.
      contents: write

    steps:
      # Full history, because the packager derives the version and the
      # changelog from git.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      # Decide, in one place, whether this run may upload and whether it drafts
      # a GitHub release; the rules are tooling.release.publish_mode's, where
      # they are unit-tested. `-d` (package, upload nothing) whenever a
      # hand-started run has `dry_run` on, a site variable is missing, or the
      # tag is a package tag. A draft release only when the run's ref is the
      # tag being released (pushed, or a hand-started run from that tag).
      - name: Decide between dry run and upload
        id: mode
        env:
          DRY_RUN_INPUT: ${{ inputs.dry_run }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          CURSEFORGE_PROJECT_ID: ${{ vars.CURSEFORGE_PROJECT_ID }}
          WAGO_ID: ${{ vars.WAGO_ID }}
          WOWI_ID: ${{ vars.WOWI_ID }}
        run: |
          set -euo pipefail
          python3 -m tooling.release.publish_mode --kind "${KIND}" \
            --dry-run-input "${DRY_RUN_INPUT}" --ref-type "${REF_TYPE}" \
            --ref-name "${REF_NAME}" --tag "${TAG}" --github-output "${GITHUB_OUTPUT}"

      # The packager needs `<package-as>.toc` at the top of the checkout. Both
      # files written here are generated from the manifests and .pkgmeta and
      # are never committed:
      #   - bundle tag: MoltenCodes.toc, loading every release Kit; the
      #     repository's .pkgmeta is used as it is;
      #   - package tag: MoltenCodes-<Facade>.toc, loading that Kit and the
      #     Kits it requires, and .pkgmeta-package, the repository's .pkgmeta
      #     narrowed to the same Kits under `package-as: MoltenCodes-<Facade>`,
      #     handed to the packager with `-m`.
      - name: Write the addon .toc and the packager metadata
        id: metadata
        run: |
          set -euo pipefail
          if [[ "${KIND}" == "package" ]]; then
            python3 -m tooling.release.library_toc --package "${PACKAGE_ID}" --write .
            python3 -m tooling.release.pkgmeta --package "${PACKAGE_ID}" --output .pkgmeta-package
            cat .pkgmeta-package
            echo "args=-m .pkgmeta-package" >> "${GITHUB_OUTPUT}"
          else
            python3 -m tooling.release.library_toc --write .
            echo "args=" >> "${GITHUB_OUTPUT}"
          fi
          cat ./*.toc

      # GITHUB_OAUTH is deliberately not passed: with it the packager would
      # create a published GitHub release of its own.
      - name: Package with the BigWigs packager
        uses: BigWigsMods/packager@e50a250f8705041e40f2fa1ddcb280a686d65aa0 # v2.6.1
        with:
          args: ${{ steps.metadata.outputs.args }} ${{ steps.mode.outputs.args }}
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
          WOWI_API_TOKEN: ${{ secrets.WOWI_API_TOKEN }}

      - name: Download the bundles
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts

      - name: Collect the release assets
        run: |
          set -euo pipefail
          mkdir -p release-assets
          find artifacts -name '*.zip' -exec cp {} release-assets/ \;
          (cd release-assets && sha256sum -- *.zip > SHA256SUMS.txt && cat SHA256SUMS.txt)

      # The notes are the tag's section of docs/RELEASES.md; `resolve` has
      # already refused a tag without one. A rehearsal prints them too.
      - name: Write the release notes
        if: env.TAG != ''
        run: |
          set -euo pipefail
          python3 -m tooling.release.notes "${TAG}" > release-notes.md
          cat release-notes.md

      # Always a draft, and only when the run's ref is the released tag: a
      # maintainer reviews it and publishes it by hand. An existing draft is
      # updated in place; an already published release is never touched.
      - name: Create or update the draft GitHub release
        if: steps.mode.outputs.draft == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if is_draft="$(gh release view "${TAG}" --json isDraft --jq .isDraft 2>/dev/null)"; then
            if [[ "${is_draft}" != "true" ]]; then
              echo "::error::Release ${TAG} is already published; refusing to modify it."
              exit 1
            fi
            gh release edit "${TAG}" --draft --notes-file release-notes.md
            gh release upload "${TAG}" release-assets/* --clobber
          else
            gh release create "${TAG}" --draft --verify-tag --title "${TAG}" \
              --notes-file release-notes.md release-assets/*
          fi
