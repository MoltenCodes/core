name: Links

# Checks every link in the repository's Markdown with lychee (lychee.toml):
# external URLs, and `#fragment` anchors into Markdown headings.
#
# This is deliberately not a gate in ci.yml. Whether an external page answers
# depends on that site, not on the change under review, so a required check
# would fail pull requests at random. Repository-relative file links are
# already a gate there (`python3 -m tooling.validation.validate_repository`).
# Here the check runs on pull requests and pushes that change Markdown, where
# a failure most likely points at the change, and weekly, which catches pages
# that disappeared on their own; a failed scheduled run notifies the
# maintainers like any failed workflow.

on:
  pull_request:
    paths:
      - "**/*.md"
      - lychee.toml
      - .github/workflows/links.yml
  push:
    branches: [main]
    paths:
      - "**/*.md"
      - lychee.toml
      - .github/workflows/links.yml
  schedule:
    # Weekly, Monday at an off-peak minute.
    - cron: "29 4 * * 1"
  workflow_dispatch:

# Nothing by default; the job asks for what it uses.
permissions: {}

concurrency:
  group: links-${{ github.ref }}
  cancel-in-progress: true

env:
  # The lychee release, from its release page's
  # `lychee-x86_64-unknown-linux-gnu.tar.gz.sha256`. Bumped by hand like the
  # other binaries in ci.yml, both values together.
  LYCHEE_VERSION: "0.24.2"
  LYCHEE_SHA256: "1f4e0ef7f6554a6ed33dd7ac144fb2e1bbed98598e7af973042fc5cd43951c9a"

jobs:
  lychee:
    name: lychee
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The binary rather than lychee-action, so it is verified by checksum
      # like every other tool CI downloads.
      - name: Install lychee
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --output lychee.tar.gz \
            "https://github.com/lycheeverse/lychee/releases/download/lychee-v${LYCHEE_VERSION}/lychee-x86_64-unknown-linux-gnu.tar.gz"
          echo "${LYCHEE_SHA256}  lychee.tar.gz" | sha256sum --check --strict -
          mkdir -p "${RUNNER_TEMP}/lychee"
          tar -xzf lychee.tar.gz -C "${RUNNER_TEMP}/lychee" --strip-components=1 \
            lychee-x86_64-unknown-linux-gnu/lychee
          rm lychee.tar.gz
          echo "${RUNNER_TEMP}/lychee" >> "${GITHUB_PATH}"

      # Results of external checks younger than a day (`max_cache_age`) are
      # reused, so a run requests only what it has not confirmed recently.
      - name: Restore the lychee cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .lycheecache
          key: lychee-${{ github.sha }}
          restore-keys: lychee-

      # The job token raises GitHub's rate limit for links to github.com.
      - name: Check every Markdown link
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          status=0
          lychee --config lychee.toml --format markdown \
            --output "${RUNNER_TEMP}/lychee.md" '**/*.md' || status=$?
          cat "${RUNNER_TEMP}/lychee.md" >> "${GITHUB_STEP_SUMMARY}"
          exit "${status}"
