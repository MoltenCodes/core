"area: tooling":
  - changed-files:
      - any-glob-to-any-file:
          - "tooling/**"
          - "pyproject.toml"
          - "cspell.json"
          - "selene.toml"
          - "selene-tests.toml"
          - "busted.yml"
          - "stylua.toml"
          - ".busted"
          - ".luarc.json"
          - "meta/**"
          - ".vscode/**"
          - ".editorconfig"

"area: docs":
  - changed-files:
      - any-glob-to-any-file:
          - "docs/**"
          - "README.md"
          - "CONTRIBUTING.md"
          - "CODE_OF_CONDUCT.md"
          - "SECURITY.md"
          - "SUPPORT.md"
          - "packages/README.md"

"area: ci":
  - changed-files:
      - any-glob-to-any-file:
          - ".github/**"
          - ".pkgmeta"

"area: fixture":
  - changed-files:
      - any-glob-to-any-file:
          - "tests/support/**"

"area: examples":
  - changed-files:
      - any-glob-to-any-file:
          - "examples/**"
