# Path-to-label rules for .github/workflows/pr-labeler.yml (actions/labeler).
#
# Every label named here is defined in .github/labels.yml. A pull request gets
# every label whose globs match at least one changed file, so a change that
# touches two Kits carries both labels, which is the reviewer's cue to ask for
# one Kit per pull request. Labels are only added, never removed, so a label a
# maintainer sets by hand stays.

"kit: cacheKit":
  - changed-files:
      - any-glob-to-any-file: "packages/cacheKit/**"

"kit: clientKit":
  - changed-files:
      - any-glob-to-any-file: "packages/clientKit/**"

"kit: codecKit":
  - changed-files:
      - any-glob-to-any-file: "packages/codecKit/**"

