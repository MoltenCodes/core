# Status: where the issue or pull request stands.
- name: "needs triage"
  color: "ededed"
  description: "Not yet reviewed by a maintainer."
- name: "needs reproduction"
  color: "fef2c0"
  description: "Cannot be acted on until someone reproduces it with the steps given."
- name: "blocked"
  color: "d93f0b"
  description: "Waiting on another issue, a decision or a client change."
- name: "ready"
  color: "0e8a16"
  description: "Triaged and specified well enough for anyone to start."
- name: "in progress"
  color: "fbca04"
  description: "Someone is working on it; say so before starting in parallel."

# Priority: how soon it should be dealt with.
- name: "p0"
  color: "b60205"
  description: "Critical: breaks addons for players now, or a security issue."
- name: "p1"
  color: "d93f0b"
  description: "High: fix in the next release of the affected Kit."
- name: "p2"
  color: "fbca04"
  description: "Normal: planned, no release is held for it."
- name: "p3"
  color: "c2e0c6"
  description: "Low: welcome when someone has the time."

# Meta: how the issue is handled.
- name: "good first issue"
  color: "7057ff"
  description: "Small and well described, a good first contribution."
- name: "help wanted"
  color: "008672"
  description: "A maintainer would welcome a pull request for this."
- name: "pinned"
  color: "c5def5"
  description: "Kept open on purpose; never marked stale."
- name: "security"
  color: "ee0701"
  description: "Security relevant; report vulnerabilities privately as SECURITY.md describes."
- name: "roadmap"
  color: "0052cc"
  description: "Tracked in docs/ROADMAP.md; never marked stale."
- name: "breaking change"
  color: "e99695"
  description: "Changes a public contract and needs a new API generation."
- name: "duplicate"
  color: "cfd3d7"
  description: "Already reported; the original is linked in a comment."
- name: "wontfix"
  color: "ffffff"
  description: "Understood, and deliberately not changed; the reason is in a comment."
- name: "invalid"
  color: "e4e669"
  description: "Not a problem with this repository."

# Automation: applied by workflows, not by hand.
- name: "stale"
  color: "eeeeee"
  description: "No activity for 60 days; comment to keep it open."
