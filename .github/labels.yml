# The repository's labels, synchronised to GitHub by
# .github/workflows/labels.yml on every push to main that changes this file.
#
# This file is the source of truth: a label that is not listed here is deleted
# by the sync, and a label renamed on GitHub by hand is renamed back. Change a
# label here, never in the repository settings. Every description is one
# sentence, and GitHub limits it to 100 characters.
#
# Colours group the labels: red and orange for defects and urgency, blue for
# areas, purple for Kits, yellow and green for status, grey for meta.

# Type: what kind of issue or change this is.
- name: "bug"
  color: "d73a4a"
  description: "A Kit, the tooling or the documentation does not behave as documented."
- name: "enhancement"
  color: "a2eeef"
  description: "A new capability or an improvement to an existing one."
- name: "documentation"
  color: "0075ca"
  description: "Documentation is missing, wrong or unclear."
- name: "question"
  color: "d876e3"
  description: "A question about using, embedding or contributing to the framework."
- name: "performance"
  color: "f9a825"
  description: "CPU time, memory or allocation cost in a Kit or the tooling."
- name: "taint"
  color: "b60205"
  description: "Taint, secret values or protected-frame access inside the game client."
- name: "regression"
  color: "e11d21"
  description: "Something that worked in an earlier release no longer does."

# Area: the part of the repository that is not a Kit.
- name: "area: tooling"
  color: "1d76db"
  description: "Repository tooling under tooling/, its configuration files and the editor metadata."
- name: "area: docs"
  color: "1d76db"
  description: "Repository-wide documentation under docs/ and the root Markdown files."
- name: "area: ci"
  color: "1d76db"
  description: "Workflows, Dependabot, the rest of .github/ and the packager metadata in .pkgmeta."
- name: "area: fixture"
  color: "1d76db"
  description: "The shared fake game client under tests/support/."
- name: "area: examples"
  color: "1d76db"
  description: "The example addon under examples/."

